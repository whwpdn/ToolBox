name: CI

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  verify:
    name: 타입 검사 · 테스트 · 빌드
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: 타입 검사
        run: npm run typecheck

      - name: 린트
        run: npm run lint

      - name: 단위 테스트
        run: npm run test

      - name: 프로덕션 빌드
        run: npx vite build

      - name: 번들 크기 리포트
        run: |
          {
            echo '### 번들 크기'
            echo ''
            echo '| 파일 | 크기 | gzip |'
            echo '|---|---:|---:|'
            for f in dist/assets/*.js dist/assets/*.css; do
              [ -f "$f" ] || continue
              raw=$(du -k "$f" | cut -f1)
              gz=$(gzip -c "$f" | wc -c)
              echo "| $(basename "$f") | ${raw} kB | $((gz / 1024)) kB |"
            done
          } >> "$GITHUB_STEP_SUMMARY"

  image:
    name: Docker 이미지 빌드 · 푸시
    needs: verify
    runs-on: ubuntu-latest
    # 포크에서 온 PR은 GHCR 쓰기 권한이 없으므로 푸시하지 않는다
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: GHCR 로그인
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 태그·라벨 생성
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      # 멀티아키텍처 이미지는 로컬로 load할 수 없으므로,
      # 먼저 amd64 단일 이미지를 만들어 실제로 띄워보고 나서 푸시한다.
      - name: 테스트용 이미지 빌드 (amd64)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: toolbox:ci-test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 이미지 동작 확인
        run: |
          docker run -d --name toolbox-test -p 8080:80 toolbox:ci-test

          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8080/healthz > /dev/null 2>&1; then break; fi
            if [ "$i" -eq 30 ]; then docker logs toolbox-test; exit 1; fi
            sleep 1
          done
          echo "✔ 헬스체크 통과"

          curl -fsS http://localhost:8080/ | grep -q '<div id="app"'
          echo "✔ index.html 서빙"

          # SPA fallback: 라우터 경로를 직접 열어도 index.html 이 나와야 한다
          # (try_files 설정이 빠지면 여기서 404가 난다)
          code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/tools/bmi)
          [ "$code" = "200" ] || { echo "SPA fallback 실패: $code"; exit 1; }
          echo "✔ SPA fallback (/tools/bmi → 200)"

          # 해시 붙은 자산은 영구 캐시 헤더를 가져야 한다
          asset=$(curl -fsS http://localhost:8080/ | grep -o '/assets/[^"]*\.js' | head -1)
          curl -sI "http://localhost:8080${asset}" | grep -qi 'cache-control: public, immutable'
          echo "✔ 자산 캐시 헤더"

          # index.html 은 반대로 캐시되지 않아야 한다 (배포 즉시 반영)
          curl -sI http://localhost:8080/index.html | grep -qi 'cache-control: no-cache'
          echo "✔ index.html no-cache 헤더"

          docker rm -f toolbox-test

      - name: 멀티아키텍처 빌드 · 푸시
        uses: docker/build-push-action@v6
        with:
          context: .
          # NAS가 ARM일 수 있어 두 아키텍처를 모두 만든다
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 요약
        run: |
          {
            echo '### 푸시된 이미지'
            echo ''
            echo '```'
            echo '${{ steps.meta.outputs.tags }}'
            echo '```'
            echo ''
            echo 'NAS에서 사용:'
            echo '```bash'
            echo 'docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest'
            echo 'docker compose up -d'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
