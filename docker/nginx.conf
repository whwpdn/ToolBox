server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # NAS 내부망에서 접속하는 경우가 많아 압축을 켜둔다
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/manifest+json
        image/svg+xml;

    # 파일명에 해시가 붙은 자산은 내용이 바뀌면 이름도 바뀌므로 영구 캐시해도 안전하다
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    # index.html은 캐시하지 않는다. 배포 즉시 새 번들을 가리키게 하기 위한 것.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache";
        types { } default_type application/manifest+json;
    }

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # SPA fallback.
    # 이게 없으면 /tools/bmi 를 새로고침할 때 404가 난다.
    location / {
        try_files $uri $uri/ /index.html;
    }

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    # 모든 계산이 브라우저에서 끝나므로 외부 연결이 필요 없다.
    # 서드파티 스크립트·비콘이 끼어들 여지를 차단한다.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'none'" always;
}
